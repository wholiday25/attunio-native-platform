# Publish AzureImageBuilder Pipeline images from DEV to PROD


trigger: none
pr: none
# PowerShell
# Run a PowerShell script on Linux, macOS, or Windows
jobs:
- job: AIB
  pool:
    name: aibBuildServer
  timeoutInMinutes: 360
  cancelTimeoutInMinutes: 10
  steps:
    - powershell: Write-Host "##vso[task.setvariable variable=USE_MSAL]true"
      displayName: USE MSAL
    - task: AzureFileCopy@5
      inputs:
        AdditionalArgumentsForBlobCopy: '--overwrite=true'
        SourcePath: 'scripts/*'
        TargetPath: ''
        azureSubscription: 'WVD-Dev'
        Destination: 'AzureBlob'
        storage: 'aibdev'
        ContainerName: 'scripts'
    - task: AzurePowerShell@5
      displayName: 'Clone Azure Image Builder Win11Developer to production'
      inputs:
        azureSubscription: 'WVD-Dev' #This is the devops service connection name
        ErrorActionPreference: 'Stop'
        FailOnStandardError: true
        ScriptType: 'FilePath'
        ScriptPath: './Win11DeveloperPublish.ps1'
        azurePowerShellVersion: 'LatestVersion'

